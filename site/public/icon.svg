<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="B-Emblem">
  <!-- ⚠️ EDIT icon.svg AND icon-square.svg TOGETHER. They are the same file
       with one attribute different — icon.svg has the rounded plate, the square
       one does not — and nothing else may diverge.

       The square source feeds BOTH masked consumers: iOS applies its own
       superellipse and Android its own mask, and handing either the rounded
       plate leaves dark wedges in the corners.

       THE MARK IS NOT RESCALED FOR MASKABLE. Its ink measures 226x227 in the
       512 canvas (44%), farthest corner 173px from centre against a 205px safe
       radius, so it clears the mask as drawn.

       Colours are HARD-CODED here and duplicated in manifest.webmanifest and in
       the theme-color meta, by necessity: CSS cannot reach inside an icon the
       browser fetches by URL, so the emblem token cannot supply them.

       ⚠️ NO DOUBLE HYPHEN ANYWHERE IN THIS COMMENT. XML forbids it, so writing
       a CSS custom property name in the ordinary way makes the file
       unparseable — rsvg refuses it and the whole icon set fails to build.
       Name tokens in prose here, never in their real syntax. -->
  <rect width="512" height="512" rx="112" fill="#0A0A0F"/>
  <g transform="translate(106.67 106.67) scale(12.5)">
